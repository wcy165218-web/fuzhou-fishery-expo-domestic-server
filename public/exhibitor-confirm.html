	      control.classList.remove('is-invalid');
	      control.removeAttribute('aria-invalid');
	      const errorNode = getControlErrorNode(control);
	      if (errorNode) {
	        errorNode.textContent = '';
	        errorNode.classList.remove('is-visible');
	      }
	    }
	    function setControlError(control, message) {
	      if (!control) return;
	      control.classList.remove('is-invalid');
	      void control.offsetWidth;
	      control.classList.add('is-invalid');
	      control.setAttribute('aria-invalid', 'true');
	      const errorNode = getControlErrorNode(control);
	      if (errorNode) {
	        errorNode.textContent = message || control.dataset.requiredMessage || '请填写该必填项。';
	        errorNode.classList.add('is-visible');
	      }
	    }
	    function initFieldFeedback() {
	      document.querySelectorAll('.confirm-control').forEach((control) => {
	        updateCharacterCounter(control);
	        control.addEventListener('input', () => {
	          clearControlError(control);
	          updateCharacterCounter(control);
	        });
	      });
	    }
	    function markInvalidFields(controls) {
	      const invalidControls = controls.filter((control) => control && !String(control.value || '').trim());
	      invalidControls.forEach((control) => {
	        setControlError(control, control.dataset.requiredMessage || '请填写该必填项。');
	      });
	      const first = invalidControls[0];
      if (first) {
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => {
          try { first.focus({ preventScroll: true }); } catch (error) { first.focus(); }
        }, 360);
	      }
	      return invalidControls.length;
	    }
	    function setSubmitButtonState(button, stateName) {
	      if (!button) return;
	      button.classList.remove('success');
	      button.removeAttribute('aria-busy');
	      if (stateName === 'loading') {
	        button.disabled = true;
	        button.setAttribute('aria-busy', 'true');
	        button.innerHTML = '<span class="submit-content"><span class="submit-spinner" aria-hidden="true"></span><span>提交中...</span></span>';
	        return;
	      }
	      if (stateName === 'success') {
	        button.disabled = true;
	        button.classList.add('success');
	        button.innerHTML = '<span class="submit-content"><svg viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true"><path d="m5.5 12.5 4.1 4.1 8.9-9.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>提交成功</span></span>';
	        return;
	      }
	      button.disabled = false;
	      button.innerHTML = '<span class="submit-content"><span>提交确认</span></span>';
	    }
	    function confirmSubmitInline() {
	      return new Promise((resolve) => {
	        const existing = document.getElementById('submit-confirm-dialog');
        if (existing) existing.remove();
        const mask = document.createElement('div');
        mask.id = 'submit-confirm-dialog';
        mask.className = 'confirm-dialog-mask';
	        mask.innerHTML = `
	          <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="submit-confirm-title">
	            <h2 id="submit-confirm-title">确认提交信息吗？</h2>
	            <p>提交后您的楣板信息将被锁定并下发制作，如需再改只能联系组委会，请最后检查一遍是否有错别字。</p>
	            <div class="dialog-actions">
	              <button type="button" class="dialog-button secondary" data-cancel-submit>再检查一下</button>
	              <button type="button" class="dialog-button primary" data-confirm-submit>我已核对无误，提交</button>
	            </div>
	          </div>
	        `;
        const finish = (value) => {
          mask.remove();
          resolve(value);
        };
        mask.addEventListener('click', (event) => {
          if (event.target === mask || event.target.closest('[data-cancel-submit]')) finish(false);
          if (event.target.closest('[data-confirm-submit]')) finish(true);
        });
        document.body.appendChild(mask);
      });
    }
	    function renderError(message) {
	      removeEntryReminderDialog();
	      document.getElementById('app').innerHTML = `
	        <section class="error-shell">
          <div class="error-card">
            <h1>链接暂不可用</h1>
            <p>${escapeHtml(message || '链接无效或已过期，请联系业务员重新获取。')}</p>
          </div>
        </section>
      `;
    }
    function buildBoothSummary(rows = []) {
      if (!rows.length) return '<div class="empty-text">暂无展位信息</div>';
      return `
        <div class="booth-table-wrap">
          <table class="booth-table">
            <thead>
              <tr><th>馆号</th><th>展位号</th><th>展位类型</th><th>面积</th></tr>
            </thead>
            <tbody>
              ${rows.map((row) => `<tr><td data-label="馆号">${escapeHtml(row.hall || '-')}</td><td data-label="展位号">${escapeHtml(row.booth_code || '-')}</td><td data-label="展位类型">${escapeHtml(row.booth_type_label || row.booth_type || '-')}</td><td data-label="面积">${formatArea(row.area)}㎡</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
	    function countedTextarea({ id, value = '', readonly = false, maxLength = 300, minHeight = '', marker = '', errorMessage = '' }) {
	      const safeId = escapeHtml(id);
	      const style = minHeight ? ` style="min-height:${escapeHtml(minHeight)}"` : '';
	      const markerAttr = marker ? ` ${marker}` : '';
	      const errorAttr = errorMessage ? ` data-required-message="${escapeHtml(errorMessage)}"` : '';
	      const errorId = `${safeId}-error`;
	      return `
	        <div class="control-wrap">
	          <textarea id="${safeId}" maxlength="${Number(maxLength)}" data-counter-target="${safeId}" data-max-length="${Number(maxLength)}"${markerAttr}${errorAttr} aria-describedby="${errorId}" ${readonly ? 'disabled' : ''} class="confirm-control"${style}>${escapeHtml(value)}</textarea>
	          <div id="${errorId}" class="field-error" data-error-for="${safeId}" aria-live="polite"></div>
	          <div class="char-counter" data-counter-for="${safeId}">${countCharacters(value)}/${Number(maxLength)} 字</div>
	        </div>
	      `;
	    }
	    function countedInput({ key, value = '', readonly = false, maxLength = 30, marker = '', errorMessage = '' }) {
	      const safeKey = escapeHtml(key);
	      const markerAttr = marker ? ` ${marker}` : '';
	      const errorAttr = errorMessage ? ` data-required-message="${escapeHtml(errorMessage)}"` : '';
	      const errorId = `${safeKey}-error`;
	      return `
	        <div class="control-wrap">
	          <input value="${escapeHtml(value)}" maxlength="${Number(maxLength)}" data-counter-target="${safeKey}" data-max-length="${Number(maxLength)}"${markerAttr}${errorAttr} aria-describedby="${errorId}" ${readonly ? 'disabled' : ''} class="confirm-control">
	          <div id="${errorId}" class="field-error" data-error-for="${safeKey}" aria-live="polite"></div>
	          <div class="char-counter" data-counter-for="${safeKey}">${countCharacters(value)}/${Number(maxLength)} 字</div>
	        </div>
	      `;
	    }
	    function fieldBlock({ title, hint, required = true, example = '', requiredTip = '', body }) {
	      return `
	        <section class="field-block">
	          <div class="field-head">
	            <h2 class="field-title">${escapeHtml(title)}${required ? requiredBadge() : ''}</h2>
	            <p class="field-hint">${escapeHtml(hint || '')}</p>
	            ${example || requiredTip ? `
	              <div class="field-guide">
	                ${example ? `<div class="field-guide-line example">${escapeHtml(example)}</div>` : ''}
	                ${requiredTip ? `<div class="field-guide-line required-tip">${escapeHtml(requiredTip)}</div>` : ''}
	              </div>
	            ` : ''}
	          </div>
	          ${body}
	        </section>
      `;
    }
	    function buildLintelEditor(lintels = [], readonly) {
	      if (!lintels.length) return '';
	      return fieldBlock({
	        title: '楣板信息确认',
	        hint: '请确认现场楣板制作文字。中文楣板必填，英文楣板如有请填写；现场拆改将会收取拆改费。',
	        required: !readonly,
	        example: readonly ? '' : '中文楣板名将用于现场楣板制作，请按营业执照或确认后的参展名称逐字核对。',
	        requiredTip: readonly ? '' : '每个可编辑展位都必须填写中文楣板名；英文名和备注可按需要填写。',
	        body: `<div class="lintel-list">${lintels.map((lintel, index) => {
	          const locked = readonly || !lintel.can_external_edit;
	          const boothSlug = String(lintel.booth_code || 'booth').replace(/[^a-zA-Z0-9_-]+/g, '-');
	          const counterBase = `lintel-${index}-${boothSlug}`;
	          return `
            <div class="lintel-row" data-lintel-row data-booth-code="${escapeHtml(lintel.booth_code || '')}">
              <div class="lintel-top">
	                <div class="lintel-title">展位 ${escapeHtml(lintel.booth_code || '-')}</div>
	                ${lintel.external_lock_reason ? `<div class="lock-chip">${escapeHtml(lintel.external_lock_reason)}</div>` : ''}
	              </div>
	              <label class="control-label">中文楣板名 ${!locked ? requiredBadge() : ''}</label>
	              ${!locked ? '<div class="control-guide">请逐字核对，避免错别字、简称误用或多余空格；提交后会锁定并下发制作。</div>' : ''}
	              ${countedInput({ key: `${counterBase}-zh`, value: lintel.name_zh || '', readonly: locked, maxLength: 30, marker: 'data-lintel-name-zh', errorMessage: `请填写展位 ${lintel.booth_code || '-'} 的中文楣板名。` })}
	              <label class="control-label">英文楣板名（如有）</label>
	              ${countedInput({ key: `${counterBase}-en`, value: lintel.name_en || '', readonly: locked, maxLength: 80, marker: 'data-lintel-name-en' })}
              <label class="control-label">备注</label>
              ${countedTextarea({ id: `${counterBase}-remark`, value: lintel.remark || '', readonly: locked, maxLength: 120, minHeight: '84px', marker: 'data-lintel-remark' })}
            </div>
          `;
        }).join('')}</div>`
      });
    }
    function renderPage(data) {
      state.data = data;
      const order = data.order || {};
	      const readonly = !!data.link?.readonly;
	      const collectionClosed = !!data.link?.collection_closed;
	      const submittedText = formatChinaTime(order.submitted_at || data.link?.submitted_at);
	      const deadlineText = getCollectionDeadlineDisplay(data) || formatChinaTime(getCollectionDeadline(data));
	      const timeReminder = deadlineText
	        ? '请在上方截止时间前完成填写并提交。'
	        : '请尽快完成填写并提交。';
      document.getElementById('app').innerHTML = `
        <div class="confirm-page">
          <header class="confirm-hero${data.settings?.banner_image_url ? ' has-banner' : ''}">
            <div class="hero-inner">
              <div class="hero-project">${escapeHtml(data.project?.name || '福州渔博会')}</div>
              <h1 class="hero-title">${escapeHtml(data.settings?.title_text || '请核对并确认参展信息')}</h1>
            </div>
            ${data.settings?.banner_image_url ? `
              <div class="confirm-banner-frame">
                <img src="${escapeHtml(data.settings.banner_image_url)}" alt="" class="confirm-banner">
              </div>
            ` : ''}
          </header>
	          <div class="card-wrap">
	            <section class="confirm-card">
	              <div class="card-body">
                  <section class="content-panel status-panel">
	                  <div id="deadline-panel-slot">${buildDeadlinePanel(data)}</div>
	                  ${readonly && submittedText ? `
                    <div class="notice readonly">
                      ${noticeIcon()}
                      <div>您的楣板信息已于 ${escapeHtml(submittedText)} 成功提交并确认。当前页面仅供查看；如需修改，请联系您的组委会联系人，由业务员发起“申请编辑信息”后重新提交。</div>
                    </div>
                  ` : collectionClosed ? `
                    <div class="notice readonly">
                      ${noticeIcon()}
                      <div>信息收集已于 ${escapeHtml(deadlineText || '设置的截止时间')} 截止，当前页面仅供查看，不能再编辑或提交。如需处理，请联系组委会联系人。</div>
                    </div>
                  ` : `
		                    <div class="notice">
		                      ${noticeIcon()}
		                      <div>${timeReminder}请重点核对带“必填”标识的字段。提交后将无法自行修改，如需修改请联系组委会联系人重新开通编辑。</div>
		                    </div>
	                  `}
                  </section>
                  <section class="content-panel readonly-panel">
                    <h2 class="panel-heading">基础信息</h2>
                    <div class="summary-grid">
                      <div><div class="meta-label">公司名称</div><div class="meta-value">${escapeHtml(order.company_name || '-')}</div></div>
                    </div>
                    <section class="section">
                      <h2 class="section-title">展位信息</h2>
                      ${buildBoothSummary(data.booth_rows || [])}
                    </section>
	                  </section>
	                  <section class="content-panel form-panel">
	                    <h2 class="panel-heading">信息填写</h2>
	                    ${readonly ? '' : `
	                      <div class="required-summary">
	                        <span class="required-summary-icon" aria-hidden="true">*</span>
	                        <div><strong>本页必填：</strong>详细展品、企业简介或产品亮点、中文楣板名。请先补全带“必填”标识的内容，再提交确认。</div>
	                      </div>
	                    `}
	                    <div class="field-grid">
	                      ${fieldBlock({
	                        title: '详细展品',
	                        hint: '该信息将用于对外展示和供需对接等，如需修改请直接编辑。',
	                        required: !readonly,
	                        example: readonly ? '' : '可填写主营品类、核心产品、服务范围，建议具体到产品名称。',
	                        requiredTip: readonly ? '' : '请至少填写一项明确展品或服务，避免只写“水产”“食品”等过于笼统的词。',
	                        body: countedTextarea({
	                          id: 'main-business',
	                          value: order.main_business || '',
	                          readonly,
	                          maxLength: 300,
	                          errorMessage: '请填写详细展品，例如主营品类、核心产品或服务范围。'
	                        })
	                      })}
	                      ${fieldBlock({
	                        title: '企业简介或产品亮点',
	                        hint: '该信息将用于对外展示和供需对接等，如需修改请直接编辑。',
	                        required: !readonly,
	                        example: readonly ? '' : '可填写企业优势、产品卖点、供需对接信息，建议 1-3 句话。',
	                        requiredTip: readonly ? '' : '请用完整语句描述企业或产品亮点，便于采购商和观众快速了解。',
	                        body: countedTextarea({
	                          id: 'profile',
	                          value: order.profile || '',
	                          readonly,
	                          maxLength: 300,
	                          errorMessage: '请填写企业简介或产品亮点，建议用 1-3 句话说明。'
	                        })
	                      })}
                    </div>
                    <div class="section">
                      ${buildLintelEditor(data.lintels || [], readonly)}
                    </div>
                    ${readonly
                      ? '<div class="readonly-summary">信息已提交确认，当前为只读概览。</div>'
	                    : '<button id="submit-btn" type="button" onclick="submitConfirmation()" class="submit-button"><span class="submit-content"><span>提交确认</span></span></button>'}
                  </section>
              </div>
            </section>
          </div>
        </div>
      `;
		      startDeadlineCountdown();
		      startDeadlineSettingsSync();
	        initFieldFeedback();
	        maybeShowEntryReminder(data);
	    }
    async function loadOverview() {
      if (!state.token) {
        renderError('链接缺少安全令牌，请联系业务员重新获取。');
        return;
      }
      try {
	        renderPage(await fetchOverview());
      } catch (error) {
        renderError(error.message);
      }
    }
	    async function submitConfirmation() {
	      if (!state.reminderAcknowledged) {
	        showEntryReminder(state.data);
	        return;
	      }
	      const mainBusinessControl = document.getElementById('main-business');
      const profileControl = document.getElementById('profile');
      const lintelRows = Array.from(document.querySelectorAll('[data-lintel-row]'));
      const requiredControls = [
        mainBusinessControl,
        profileControl,
        ...lintelRows.map((row) => row.querySelector('[data-lintel-name-zh]'))
      ];
	      const missingRequiredCount = markInvalidFields(requiredControls);
	      if (missingRequiredCount) {
	        showInlineMessage(`还有 ${missingRequiredCount} 项必填未完成，请先补全红框标出的内容。`, 'error');
	        return;
	      }
      const mainBusiness = mainBusinessControl?.value?.trim() || '';
      const profile = profileControl?.value?.trim() || '';
      if (profile.length > 300) {
        showInlineMessage('企业简介或产品亮点不能超过 300 字。', 'error');
        return;
      }
      const lintels = lintelRows.map((row) => ({
        booth_code: row.dataset.boothCode || '',
        name_zh: row.querySelector('[data-lintel-name-zh]')?.value?.trim() || '',
        name_en: row.querySelector('[data-lintel-name-en]')?.value?.trim() || '',
        remark: row.querySelector('[data-lintel-remark]')?.value?.trim() || ''
      }));
	      if (!(await confirmSubmitInline())) return;
	      const button = document.getElementById('submit-btn');
	      setSubmitButtonState(button, 'loading');
	      try {
	        const result = await readJson(await fetch(`/api/public/exhibitor-confirmations/${encodeURIComponent(state.token)}/submit`, {
	          method: 'POST',
	          headers: { 'Content-Type': 'application/json' },
	          body: JSON.stringify({ main_business: mainBusiness, profile, lintels })
	        }));
	        setSubmitButtonState(button, 'success');
	        renderPage(result.overview);
	        window.scrollTo({ top: 0, behavior: 'smooth' });
	      } catch (error) {
	        showInlineMessage(error.message || '提交失败', 'error');
	        setSubmitButtonState(button, 'idle');
	      }
    }
    loadOverview();
  </script>
</body>
</html>
